<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact - Voxel Vault</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dark-theme.css">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="dark-theme">
    <header class="container">
        <a href="index.html" class="logo">
            <img src="img/voxelvault-high-resolution-logo-transparent.png" alt="Voxel Vault Logo" class="light-logo">
            <img src="img/voxelvault-high-resolution-logo-grayscale-transparent.png" alt="Voxel Vault Logo" class="dark-logo">
        </a>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects.html">Projects</a>
            <a href="careers.html">Careers</a>
            <a href="blog.html">Blog</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="theme-switcher">
            <i class="fas fa-sun"></i>
        </div>
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </header>
    <main class="container" style="padding-top: 40px; padding-bottom: 40px;">
        <h1 class="section-title">Contact Us</h1>
        <form action="mailto:contact@voxelvault.com" method="post" enctype="text/plain">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="7" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer class="container">
        <div class="footer-grid">
            <div class="logo">
                <a href="index.html">
                    <img src="img/voxelvault-high-resolution-logo-transparent.png" alt="Voxel Vault Logo" class="light-logo">
                    <img src="img/voxelvault-high-resolution-logo-grayscale-transparent.png" alt="Voxel Vault Logo" class="dark-logo">
                </a>
            </div>
            <div>
                <h4>Company</h4>
                <ul>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="careers.html">Careers</a></li>
                    <li><a href="blog.html">Blog</a></li>
                    <li><a href="privacy.html">Privacy Policy</a></li>
                </ul>
            </div>
            <div>
                <h4>Connect</h4>
                <div class="social-links">
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="fab fa-linkedin"></i></a>
                    <a href="#"><i class="fab fa-github"></i></a>
                </div>
            </div>
        </div>
        <p>&copy; 2026 Voxel Vault. All rights reserved.</p>
    </footer>

    <script>
        const themeSwitcher = document.querySelector('.theme-switcher i');
        const body = document.querySelector('body');
        const hamburger = document.querySelector('.hamburger');
        const navMenu = document.querySelector('nav');

        themeSwitcher.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            if (body.classList.contains('dark-theme')) {
                themeSwitcher.classList.remove('fa-moon');
                themeSwitcher.classList.add('fa-sun');
            } else {
                themeSwitcher.classList.remove('fa-sun');
                themeSwitcher.classList.add('fa-moon');
            }
        });

        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navMenu.classList.toggle('active');
        });
    </script>
</body>
</html>
